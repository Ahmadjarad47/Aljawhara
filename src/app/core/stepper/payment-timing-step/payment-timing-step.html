<section aria-labelledby="payment-heading" [dir]="isRTL() ? 'rtl' : 'ltr'">
  <h2 id="payment-heading">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20m-15 6h4"/></svg>
    {{ t('paymentTimingTitle') }}
  </h2>
  <div class="payment-options" role="radiogroup" [attr.aria-label]="t('paymentTimingTitle')">
    @for (timing of ['now', 'on_delivery']; track timing) {
      <label class="payment-option" [class.selected]="selectedTiming() === timing">
        <input type="radio" name="paymentTiming" [value]="timing" [checked]="selectedTiming() === timing"
          (change)="selectTiming(timing === 'now' ? 'now' : 'on_delivery')" [disabled]="isCreatingOrder()" />
        <span class="payment-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4a2 2 0 0 0-2 2v2h20V6a2 2 0 0 0-2-2H4zm18 7H2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-7zM5 14h5v2H5v-2z"/></svg>
        </span>
        <span class="payment-copy">
          <strong>{{ t(timing === 'now' ? 'payNow' : 'payOnDelivery') }}</strong>
          <span>{{ t(timing === 'now' ? 'payNowDescription' : 'payOnDeliveryDescription') }}</span>
        </span>
      </label>
    }
  </div>
  @if (error()) {
    <p class="payment-error" role="alert">{{ error() }}</p>
  }
</section>
