<section aria-labelledby="delivery-heading">
  <h2 id="delivery-heading">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v6m8-6v6m-6 5h4"/></svg>
    {{ t('shippingTitle') }}
  </h2>
  @if (isLoading()) {
    <div class="address-loading" role="status"><span class="loading loading-spinner loading-lg"></span></div>
  } @else {
    <form id="shipping-address" #addressForm="ngForm" (ngSubmit)="submitted.emit()">
      <div class="contact-fields">
        <div class="field">
          <label for="fullName">{{ t('fullName') }} <span>*</span></label>
          <input id="fullName" name="fullName" autocomplete="name" [(ngModel)]="formData.fullName" (ngModelChange)="formChanged()" required maxlength="100" />
        </div>
        <div class="field">
          <app-phone-input fieldId="phoneNumber" [required]="true" [value]="formData.phoneNumber" (valueChange)="formData.phoneNumber = $event; formChanged()"
            [country]="phoneCountry" (countryChange)="changePhoneCountry($event)" [label]="t('phoneNumber')" />
        </div>
      </div>
      <div class="field address-line">
        <label for="addressLine1">{{ t('addressLine1') }} <span>*</span></label>
        <app-address-autocomplete [value]="formData.addressLine1" [language]="currentLanguage()"
          [label]="t('addressLine1')" (locationChange)="onAddressLocationChange($event)"></app-address-autocomplete>
      </div>
      <div class="address-fields">
        @for (field of optionalFields; track field.key) {
          <div class="field">
            <label [for]="field.key">{{ t(field.key) }}</label>
            <input [id]="field.key" [name]="field.key" [(ngModel)]="formData[field.key]" (ngModelChange)="formChanged()" [maxlength]="field.maxLength" />
          </div>
        }
      </div>
    </form>
  }
  @if (error()) {
    <p class="address-error" role="alert">{{ error() }}</p>
  }
</section>
