<svg class="assistant-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <symbol id="jawhara-sparkles" viewBox="0 0 32 32"><path d="m19 2 3.5 9.5L32 15l-9.5 3.5L19 28l-3.5-9.5L6 15l9.5-3.5ZM5 1l1.4 3.6L10 6 6.4 7.4 5 11 3.6 7.4 0 6l3.6-1.4Z" fill="currentColor"/></symbol>
    <symbol id="jawhara-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="jawhara-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="jawhara-attachment" viewBox="0 0 24 24"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2a4 4 0 0 1 6 6L9 18a2 2 0 0 1-3-3l9-9"/></symbol>
    <symbol id="jawhara-send" viewBox="0 0 24 24"><path d="m21 3-7 18-4-8-8-3 19-7ZM10 13 21 3"/></symbol>
  </defs>
</svg>

@if (isOpen()) {
  <section #panel id="jawhara-assistant" class="assistant-panel" role="dialog"
    animate.enter="assistant-enter" animate.leave="assistant-leave"
    aria-labelledby="jawhara-assistant-title" aria-describedby="jawhara-assistant-subtitle"
    tabindex="-1" (keydown.escape)="close()">
    <header class="assistant-header">
      <div class="assistant-heading">
        <svg class="sparkles" aria-hidden="true"><use href="#jawhara-sparkles"/></svg>
        <div>
          <h2 id="jawhara-assistant-title">مساعد الجوهرة الذكي</h2>
          <p id="jawhara-assistant-subtitle">جهّز احتياجاتك بسهولة</p>
        </div>
      </div>
      <div class="window-actions">
        <button type="button" class="icon-button" aria-label="تصغير المساعد" (click)="close()">
          <svg aria-hidden="true"><use href="#jawhara-minus"/></svg>
        </button>
        <button type="button" class="icon-button" aria-label="إغلاق المساعد" (click)="close()">
          <svg aria-hidden="true"><use href="#jawhara-close"/></svg>
        </button>
      </div>
    </header>

    <div #conversation class="assistant-conversation" tabindex="0" aria-label="المحادثة">
      <div class="messages" role="log" aria-label="رسائل المحادثة" aria-live="polite" aria-relevant="additions">
        @for (message of messages(); track message.id) {
          <div class="message message-user"><p>{{ message.text }}</p></div>
        }
      </div>
    </div>

    <footer class="assistant-composer">
      @if (attachment()) {
        <div class="attachment-preview">
          <span>{{ attachment() }}</span>
          <button type="button" class="icon-button" aria-label="إزالة المرفق" (click)="attachment.set('')">
            <svg aria-hidden="true"><use href="#jawhara-close"/></svg>
          </button>
        </div>
      }
      <form class="composer-form" (submit)="send($event)">
        <div class="composer-field">
          <button type="button" class="icon-button attachment-button" aria-label="إرفاق ملف للمعاينة" (click)="fileInput.click()">
            <svg aria-hidden="true"><use href="#jawhara-attachment"/></svg>
          </button>
          <input #fileInput type="file" hidden (change)="selectAttachment($event)"/>
          <input #messageInput type="text" aria-label="اكتب طلبك للمساعد" placeholder="اكتب طلبك هنا..."
            maxlength="1000" autocomplete="off" enterkeyhint="send" [value]="draft()" (input)="draft.set(messageInput.value)"/>
        </div>
        <button type="submit" class="send-button" aria-label="إرسال الطلب" [disabled]="!draft().trim() && !attachment()">
          <svg aria-hidden="true"><use href="#jawhara-send"/></svg>
        </button>
      </form>
      <p class="preview-label">نسخة تجريبية للواجهة <span aria-hidden="true">·</span> المساعد الذكي قريباً</p>
    </footer>
  </section>
} @else {
  <button #launcher type="button" class="assistant-launcher" aria-label="فتح مساعد الجوهرة الذكي"
    animate.enter="launcher-enter" animate.leave="launcher-leave"
    aria-haspopup="dialog" aria-controls="jawhara-assistant" [attr.aria-expanded]="false" (click)="open()">
    <span class="launcher-icon"><svg aria-hidden="true"><use href="#jawhara-sparkles"/></svg></span>
    <span>مساعد الجوهرة الذكي<small>جهّز احتياجاتك بسهولة</small></span>
  </button>
}
